name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow>=9.5.0

      - name: Run unit tests
        run: |
          python -m unittest discover tests -v

      - name: CLI smoke tests
        run: |
          python scripts/engine.py --help
          python scripts/chromakey.py --help

      - name: Verify executable permissions (POSIX only)
        if: runner.os != 'Windows'
        run: |
          test -x bin/agy-img || (echo "bin/agy-img is not executable" && exit 1)
          test -x bin/chromakey || (echo "bin/chromakey is not executable" && exit 1)
          test -x install.sh || (echo "install.sh is not executable" && exit 1)
